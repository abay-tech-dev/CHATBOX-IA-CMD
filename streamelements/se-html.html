<div id="stage">
  <div id="widget-container">

    <!-- Terminal title bar -->
    <div id="wa-header">
      <div class="terminal-dots">
        <div class="terminal-dot dot-red"></div>
        <div class="terminal-dot dot-yellow"></div>
        <div class="terminal-dot dot-green"></div>
      </div>
      <div class="terminal-title" id="contact-name">twitch-chat — bash</div>
      <div class="wa-online-dot conn-disconnected" id="connection-dot" title="Not connected"></div>
    </div>

    <!-- Goal — horizontal (top of the terminal) -->
    <div id="goal-h" class="goal" style="display:none">
      <div class="goal-header-line">
        <span class="goal-prefix">[GOAL]</span>
        <span class="goal-label-text">Sub goal</span>
        <span class="goal-fraction-text">0 / 100</span>
        <span class="goal-pct-text">0%</span>
      </div>
      <div class="goal-bar-line">
        <span>[</span>
        <span class="goal-bar-wrap" id="goal-bar-wrap"><span class="goal-bar-ascii" id="goal-bar-ascii"></span></span>
        <span>]</span>
      </div>
      <div class="goal-desc-line" id="goal-desc" style="display:none"></div>
    </div>

    <div id="terminal-body">
      <!-- Messages -->
      <div id="messages-container">
        <div id="messages-list"></div>
        <div id="alert-layer"></div>
      </div>

      <!-- Goal — vertical (right side of the terminal) -->
      <div id="goal-v" class="goal" style="display:none">
        <span class="goal-pct-text">0%</span>
        <pre class="goal-v-bar" id="goal-v-bar"></pre>
        <span class="goal-label-text goal-v-title">Sub goal</span>
        <span class="goal-v-values"><span class="goal-current-text">0</span><span class="goal-v-sep"></span><span class="goal-target-text">100</span></span>
      </div>
    </div>

    <!-- Prompt bar (decorative) -->
    <div id="wa-input-bar">
      <span class="terminal-prompt-label" id="terminal-prompt-label">user@chat:~$</span>
      <span class="terminal-input-fake">Send a message…<span class="terminal-cursor"></span></span>
    </div>

  </div>
</div>
